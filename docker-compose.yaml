# Local infrastructure only: Postgres, NATS, an object store and a registry. `server`
# runs on the Mac; `host` runs in the Lima VM and reaches them at
# host.lima.internal.
name: alchemy

services:
  postgres:
    image: ${POSTGRES_IMAGE:-docker.io/library/postgres:16}
    # Bound on all interfaces so the Lima VM can reach it. Override the host
    # port with ALCHEMY_POSTGRES_PORT if 5435 is taken.
    ports:
      - "${ALCHEMY_POSTGRES_PORT:-5435}:5432"
    environment:
      POSTGRES_USER: alchemy
      POSTGRES_PASSWORD: alchemy
      POSTGRES_DB: alchemy
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alchemy -d alchemy"]
      interval: 2s
      timeout: 2s
      retries: 15

  nats:
    image: ${NATS_IMAGE:-docker.io/library/nats:2}
    command: ["-c", "/etc/nats/nats.conf"]
    ports:
      - "${ALCHEMY_NATS_PORT:-4223}:4222"
    configs:
      - source: nats
        target: /etc/nats/nats.conf
    volumes:
      - nats-data:/data

  # Object store for the function logs and artifacts buckets, which `just
  # infra` makes with rc. The console is on 9001.
  rustfs:
    image: ${RUSTFS_IMAGE:-docker.io/rustfs/rustfs:latest}
    ports:
      - "${ALCHEMY_RUSTFS_PORT:-9000}:9000"
      - "${ALCHEMY_RUSTFS_CONSOLE_PORT:-9001}:9001"
    environment:
      RUSTFS_ACCESS_KEY: alchemy
      RUSTFS_SECRET_KEY: alchemy123
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error
    volumes:
      - rustfs-data:/data

  # Registry for the runtime images `just images` builds. Hosts pull from it
  # over the Lima network.
  registry:
    image: ${REGISTRY_IMAGE:-docker.io/library/registry:3}
    ports:
      - "${ALCHEMY_REGISTRY_PORT:-5001}:5000"
    volumes:
      - registry-data:/var/lib/registry

# Payloads carry whole function inputs and outputs, so the message cap
# matches the server's payload limit.
configs:
  nats:
    content: |
      port: 4222
      max_payload: 64MB
      jetstream { store_dir: /data }

volumes:
  postgres-data:
  nats-data:
  rustfs-data:
  registry-data:
