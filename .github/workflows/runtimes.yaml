name: "CD: Runtimes"

# Builds each runtime whose directory changed since it was last published.
on:
  push:
    branches: [main]
    paths: ["runtimes/**", ".github/workflows/runtimes.yaml"]
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild every runtime
        required: false
        default: false
        type: boolean

permissions:
  attestations: write
  contents: read
  id-token: write
  packages: write

concurrency:
  group: runtimes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: alchemy/runtime/python
            context: runtimes/python
            version: "3.13"
          - image: alchemy/runtime/node
            context: runtimes/node
            version: "24"
          - image: alchemy/runtime/static
            context: runtimes/static
            version: "13"
          - image: alchemy/runtime/go
            context: runtimes/go
            version: "1.27"
          - image: alchemy/runtime/go
            context: runtimes/go
            version: "1.27-build"
            target: build
          - image: alchemy/runtime/rust
            context: runtimes/rust
            version: "1.99"
          - image: alchemy/runtime/rust
            context: runtimes/rust
            version: "1.99-build"
            target: build
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tree
        env:
          FORCE: ${{ inputs.force }}
        run: |
          tag="${{ matrix.version }}-$(git rev-parse --short=12 "HEAD:${{ matrix.context }}")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$FORCE" != "true" ]] && docker buildx imagetools inspect "$IMAGE:$tag" > /dev/null 2>&1; then
            echo "$IMAGE:$tag is published, skipping"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.tree.outputs.build == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - if: steps.tree.outputs.build == 'true'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ matrix.version }}
            type=raw,value=${{ steps.tree.outputs.tag }}

      - if: steps.tree.outputs.build == 'true'
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - if: steps.tree.outputs.build == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
