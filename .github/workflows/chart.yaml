name: "CD: Helm Chart"

# Packages charts/alchemy and publishes it as an OCI artifact under
# ghcr.io/galaxy-io/charts/alchemy. A release calls it once its images are
# published.
on:
  workflow_call:

permissions:
  attestations: write
  contents: write
  id-token: write
  packages: write

concurrency:
  group: helm-chart-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.21.4

      - uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
        with:
          version: v0.22.1

      - name: Read chart metadata
        id: metadata
        run: |
          version=$(yq -r '.version' charts/alchemy/Chart.yaml)
          app_version=$(yq -r '.appVersion' charts/alchemy/Chart.yaml)
          owner="${GITHUB_REPOSITORY_OWNER,,}"

          if [[ "v${version}" != "$GITHUB_REF_NAME" || "$version" != "$app_version" ]]; then
            echo "Chart.yaml is $version for app $app_version but the release is $GITHUB_REF_NAME"
            exit 1
          fi

          {
            echo "version=$version"
            echo "app_version=$app_version"
            echo "owner=$owner"
            echo "repository=ghcr.io/${owner}/charts/alchemy"
          } >> "$GITHUB_OUTPUT"

      - name: Build dependencies
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add nats https://nats-io.github.io/k8s/helm/charts
          helm dependency build charts/alchemy

      - name: Package
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          helm package charts/alchemy --destination dist
          test -f "dist/alchemy-${VERSION}.tgz"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A rerun of a published version is fine; publishing other contents
      # under it is not.
      - name: Publish OCI chart
        env:
          OWNER: ${{ steps.metadata.outputs.owner }}
          REPOSITORY: ${{ steps.metadata.outputs.repository }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          reference="${REPOSITORY}:${VERSION}"
          package="dist/alchemy-${VERSION}.tgz"
          probe_error=$(mktemp)

          if crane manifest "$reference" > /dev/null 2> "$probe_error"; then
            existing=$(mktemp -d)
            helm pull "oci://${REPOSITORY}" --version "$VERSION" --destination "$existing"
            mkdir "$existing/published" "$existing/candidate"
            tar -xzf "$existing/alchemy-${VERSION}.tgz" -C "$existing/published"
            tar -xzf "$package" -C "$existing/candidate"
            if ! diff -qr "$existing/published" "$existing/candidate"; then
              echo "Chart $VERSION is already published with different contents; bump the chart version"
              exit 1
            fi
            echo "Chart $VERSION is already published"
          else
            status=$?
            if grep -Eqi 'MANIFEST_UNKNOWN|NAME_UNKNOWN|(^|[^0-9])404([^0-9]|$)' "$probe_error"; then
              helm push "$package" "oci://ghcr.io/${OWNER}/charts"
            else
              echo "Failed to probe $reference" >&2
              cat "$probe_error" >&2
              exit "$status"
            fi
          fi

      - name: Resolve chart digest
        id: digest
        env:
          REPOSITORY: ${{ steps.metadata.outputs.repository }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          digest=$(crane digest "${REPOSITORY}:${VERSION}")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.metadata.outputs.repository }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Tag release
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.metadata.outputs.app_version }}
          OWNER: ${{ steps.metadata.outputs.owner }}
          REPOSITORY: ${{ steps.metadata.outputs.repository }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          tag="helm-chart-${VERSION}"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists"
            exit 0
          fi

          notes=$(cat <<NOTES
          Helm chart ${VERSION} for Alchemy ${APP_VERSION}.

          \`\`\`sh
          helm install alchemy oci://${REPOSITORY} --version ${VERSION}
          gh attestation verify --owner ${OWNER} oci://${REPOSITORY}:${VERSION}
          \`\`\`
          NOTES
          )

          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes "$notes" --latest=false
