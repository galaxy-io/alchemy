name: Bug report
description: Report reproducible behavior that is not working as expected.
title: "[bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Alchemy. Please search existing issues before filing a new report and remove secrets from logs, specs and configuration. Report security vulnerabilities privately as described in our [security policy](https://github.com/galaxy-io/alchemy/security/policy).

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Server or API
        - HTTP invoke endpoint
        - Host or microVMs
        - Runtime images or builds
        - Contracts
        - Web UI or @galaxy-io/alchemy-ui
        - Helm chart or deployment
        - Documentation
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Alchemy version
      description: Provide a release version, image tag, or commit SHA.
      placeholder: v0.0.1
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Where the hosts run, such as local Lima, EKS on bare metal, or GKE with nested virtualization.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what impact did it have?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the smallest function spec, input and sequence of calls that reliably reproduces the problem.
      placeholder: |
        1. Create a function with ...
        2. Invoke it with ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Include the invocation id and the error body if there is one. Remove credentials, tokens, connection strings, and customer data.
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include relevant deployment details, chart values, screenshots, or links.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed secrets and sensitive data from this report.
          required: true
