syntax = "proto3";

package supervisor.v1;

import "supervisor/v1/supervisor.proto";

// SupervisorService is the host <-> guest protocol. It is served by the
// supervisor (PID 1 in the microVM) on an AF_VSOCK listener and called by the
// host over the microVM's vsock Unix socket. The supervisor listens, not dials,
// because guest listen sockets survive snapshot/restore while open
// connections do not. Internal: both ends are versioned together because the
// guest half is frozen into every snapshot.
service SupervisorService {
  // Start is called exactly once per boot. For PROTOCOL_RUNTIME_API it
  // launches the function process and waits until it asks for its first
  // invocation. The moment Start returns is where the microVM is snapshotted.
  rpc Start(StartRequest) returns (StartResponse);

  // Invoke runs one invocation, streaming the function's stderr while it
  // runs and its result last. At most one is in flight per microVM. A host
  // that stops reading slows the function's writes down rather than losing
  // them.
  rpc Invoke(InvokeRequest) returns (stream InvokeResponse);
}
