syntax = "proto3";

package functions.v1;

import "functions/v1/invocations.proto";

// InstanceStatus is the live state of one microVM. Instances are not
// persisted: they die with the host process.
enum InstanceStatus {
  INSTANCE_STATUS_UNSPECIFIED = 0;
  INSTANCE_STATUS_BOOTING = 1;
  INSTANCE_STATUS_READY = 2;
  INSTANCE_STATUS_BUSY = 3;
  INSTANCE_STATUS_RELEASING = 4;
}

// Instance is one microVM on a host. A host knows the artifact it runs;
// the server fills in function_id and version from the artifact.
// invocation_id is set while BUSY.
message Instance {
  string id = 1;
  string function_id = 2;
  int64 version = 3;
  InstanceStatus status = 4;
  StartKind start_kind = 5;
  int64 started_at = 6;
  string invocation_id = 7;
  uint32 vcpus = 8;
  uint32 memory_mib = 9;
  string artifact_id = 10;
  string host = 11;
}

message ListInstancesRequest {
  string function_id = 1;
}

message ListInstancesResponse {
  repeated Instance instances = 1;
}

// Host describes one host process and the machine it runs on.
message Host {
  string hostname = 1;
  int64 started_at = 2;
  // slots is how many invocations may hold a instance at once; slots_in_use
  // is how many do right now.
  int32 slots = 3;
  int32 slots_in_use = 4;
  // memory_mib_committed is the guest memory of all live instances.
  int64 memory_mib_committed = 5;
  string firecracker_version = 6;
  string kernel = 7;
  int64 rootfs_cache_bytes = 8;
  int32 rootfs_cache_images = 9;
}

message ListHostsRequest {}

message ListHostsResponse {
  // Every host that has sent a heartbeat recently, by hostname.
  repeated Host hosts = 1;
}

message GetHostRequest {}

message GetHostResponse {
  Host host = 1;
}
