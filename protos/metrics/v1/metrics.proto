syntax = "proto3";

package metrics.v1;

// MetricsService is a generic, read-only aggregation surface over
// invocations: two query primitives (bucketed timeseries, windowed aggregate)
// parameterized by metric and dimension enums. New metrics and dimensions
// are enum additions; the RPC surface never changes.
service MetricsService {
  rpc QueryTimeseries(QueryTimeseriesRequest) returns (QueryTimeseriesResponse);
  rpc QueryAggregate(QueryAggregateRequest) returns (QueryAggregateResponse);
}

// Metric is an aggregatable measure over invocations. COUNT and the byte
// metrics are sums. The duration metrics are means in milliseconds over
// invocations that recorded the phase (a zero column means the phase never
// happened, e.g. acquire on an errored call, and is excluded).
enum Metric {
  METRIC_UNSPECIFIED = 0;
  METRIC_INVOCATION_COUNT = 1;
  METRIC_INVOCATION_ACQUIRE_DURATION = 2;
  METRIC_INVOCATION_RUN_DURATION = 3;
  METRIC_INVOCATION_TOTAL_DURATION = 4;
  METRIC_INVOCATION_INPUT_BYTES = 5;
  METRIC_INVOCATION_OUTPUT_BYTES = 6;
}

// MetricDimension names an invocations column usable for grouping and
// filtering. STATUS and START_KIND values are the lowercase wire tokens
// ("succeeded", "cold_boot"); the id dimensions are UUIDs.
enum MetricDimension {
  METRIC_DIMENSION_UNSPECIFIED = 0;
  METRIC_DIMENSION_TENANT_ID = 1;
  METRIC_DIMENSION_FUNCTION_ID = 2;
  METRIC_DIMENSION_STATUS = 3;
  METRIC_DIMENSION_START_KIND = 4;
}

// MetricGranularity is the bucket width for timeseries queries.
enum MetricGranularity {
  METRIC_GRANULARITY_UNSPECIFIED = 0;
  METRIC_GRANULARITY_MINUTE = 1;
  METRIC_GRANULARITY_HOUR = 2;
  METRIC_GRANULARITY_DAY = 3;
}

// MetricFilter narrows a query to invocations whose dimension is one of
// values.
message MetricFilter {
  MetricDimension dimension = 1;
  repeated string values = 2;
}

message QueryTimeseriesRequest {
  // metrics are computed together per bucket; point values align with this
  // order positionally.
  repeated Metric metrics = 1;
  int64 since_ms = 2; // inclusive
  int64 until_ms = 3; // exclusive; unset = now
  MetricGranularity granularity = 4;
  // tz_offset_minutes shifts bucket boundaries east of UTC so DAY buckets
  // match the viewer's local calendar day.
  int32 tz_offset_minutes = 5;
  MetricDimension group_by = 6; // UNSPECIFIED = one total series, key ""
  repeated MetricFilter filters = 7;
}

// TimeseriesPoint.values[i] is request.metrics[i] for this bucket.
message TimeseriesPoint {
  int64 bucket_start_ms = 1;
  repeated double values = 2;
}

// Timeseries.key is the group_by dimension's value. Points are dense: every
// bucket in [since_ms, until_ms) is present, zero-filled, ascending; all
// series of a response are index-aligned. When a filter covers the group_by
// dimension, one series per requested value is returned in request order.
message Timeseries {
  string key = 1;
  repeated TimeseriesPoint points = 2;
}

message QueryTimeseriesResponse {
  repeated Timeseries series = 1;
}

message QueryAggregateRequest {
  repeated Metric metrics = 1;
  int64 since_ms = 2; // inclusive
  int64 until_ms = 3; // exclusive; unset = now
  MetricDimension group_by = 4; // UNSPECIFIED = single total row, key ""
  repeated MetricFilter filters = 5;
}

// AggregateRow.values[i] is request.metrics[i] for this group.
message AggregateRow {
  string key = 1;
  repeated double values = 2;
}

message QueryAggregateResponse {
  repeated AggregateRow rows = 1;
}
