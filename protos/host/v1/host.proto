syntax = "proto3";

package host.v1;

import "functions/v1/common.proto";
import "functions/v1/functions.proto";
import "functions/v1/host.proto";
import "functions/v1/invocations.proto";

// host.v1 is the contract between the servers and the hosts, and between
// servers. It rides on NATS rather than a Connect service. Hosts keep no
// state the servers rely on beyond what their heartbeats last said, and
// the servers keep no state about hosts beyond those heartbeats.
//
//   host.<name>.invoke           request/reply: that host runs the
//                                invocation, or answers not_found when it
//                                has not built the artifact
//   host.<name>.build            request/reply: that host builds, replies
//                                with the Artifact
//   host.<name>.heartbeat        publish: a Heartbeat, periodically
//   host.describe                request, scatter/gather: every host replies
//                                with its Host
//   host.instances               request, scatter/gather: every host replies
//                                with its instances
//   server.<name>.state          publish: InvocationEvent, from a host to
//                                the server whose invocation moved
//   server.<name>.heartbeat      publish: a ServerHeartbeat, periodically
//   server.invocations           request, scatter/gather: every server
//                                replies with the invocations it holds
//   invocation.<function_id>     publish: an Invocation each time a server
//                                sees it change, for live streams
//   invocations.host, .server    publish, JetStream: InvocationRecords,
//                                kept until a server has written them
//
// Placement is the server's choice. A function lives on a few hosts, picked
// by rendezvous hashing of its id over the live hosts, so every server picks
// the same ones from the same heartbeats and a host joining or leaving
// moves only the functions that hashed to it. A server builds a function's
// versions on those hosts and sends each invocation to the one holding a
// warm instance, else the least loaded one that has the artifact, else it
// builds the artifact there first.
//
// Invocations are not written as they run. The host that took one publishes
// its record when it ends; the server publishes a record only when no host
// took it, or the caller went away, and that record wins. Servers share one
// consumer that writes records to the database in batches.
//
// Payloads are protobuf-encoded messages from this file. Request/reply
// errors are an Error message in the reply, never a NATS-level error.

// Artifact is everything a host needs to run an invocation, resolved at
// build time so the spec is never consulted again. The server stores it on
// the version and sends it back verbatim with every invoke.
//
// id keys instances and the invoke subject: it hashes everything that makes
// two instances interchangeable, including the tenant, so two functions with
// the same image but different env never share a warm instance. The contract
// is not in it: an instance can run any input. The drive cache is keyed by
// the image digest for the root filesystem and by the layers' digests for
// the layer drive, since those are content-addressed.
message Artifact {
  string id = 1;
  string tenant_id = 2;
  string image = 3;
  // digest is what image resolved to at build time; the artifact always runs
  // this digest even if the tag moves.
  string digest = 4;
  int64 rootfs_bytes = 5;
  repeated string argv = 6;
  map<string, string> env = 7;
  string working_dir = 8;
  functions.v1.InvocationProtocol protocol = 9;
  uint32 vcpus = 10;
  uint32 memory_mib = 11;
  // layers were extracted over the image, in order.
  repeated Layer layers = 12;
  // contract is what the host checks every input and output against.
  functions.v1.Contract contract = 13;
  // function_id and version are what the artifact was last built for. The
  // host ranks a function's artifacts by version when it evicts old ones.
  string function_id = 14;
  int64 version = 15;
  // secrets names the tenant's secrets the function receives, variable
  // name to secret name. The host fetches the values from a server.
  map<string, string> secrets = 16;
}

// SecretsRequest asks a server for the values of a function's secrets, for
// a host the function is placed on.
// SecretsRequest asks for the values of secrets a version names in
// spec.secrets. Names the version does not name are refused.
message SecretsRequest {
  string host = 1;
  string tenant_id = 2;
  string function_id = 3;
  int64 version = 5;
  repeated string names = 4;
}

message SecretsResponse {
  // values are by secret name.
  map<string, string> values = 1;
  Error error = 2;
}

// SecretsInvalidate tells every host to drop its cached values for these
// secret names, so a rotated value is refetched on the next invocation
// instead of waiting out the refresh interval.
message SecretsInvalidate {
  string tenant_id = 1;
  repeated string names = 2;
}

// Layer is a tar archive, plain or gzipped, in the artifacts bucket that a
// build extracts over its image. It is how files that are not in the image,
// such as a function built from source, reach the root filesystem.
message Layer {
  // key is the archive's key in the artifacts bucket.
  string key = 1;
  // sha256 is the archive's content digest, in hex. The build checks it, and
  // it keys the layer drive the guest lays over its root filesystem.
  string sha256 = 2;
}

// Error is a reply that carries no result. code uses Connect's names so the
// server can map it onto its own status without a table.
message Error {
  string code = 1;
  string message = 2;
}

message BuildRequest {
  string tenant_id = 1;
  functions.v1.FunctionSpec spec = 2;
  // layers are extracted over spec.image, in order.
  repeated Layer layers = 3;
  string function_id = 4;
  int64 version = 5;
}

message BuildResponse {
  oneof result {
    Artifact artifact = 1;
    Error error = 2;
  }
  // build_log is the tail of the build's output.
  string build_log = 3;
}

// InvokeRequest runs one input through an instance of artifact. The host
// checks the input against the artifact's contract before it takes a slot,
// and the output after the run. It decides how the instance is obtained.
message InvokeRequest {
  // invocation is the accepted invocation as the server knows it: its id,
  // function, version and when it was created. The host completes it into
  // the record it publishes when the invocation ends.
  functions.v1.Invocation invocation = 1;
  Artifact artifact = 2;
  bytes input = 3;
  int64 timeout_ms = 4;
  // log_key is where the host uploads the invocation's log in the log bucket.
  // The server owns the layout, so it can find the log again.
  string log_key = 5;
  // state_subject is where the host publishes InvocationEvents for this
  // invocation: the requesting server's own subject.
  string state_subject = 6;
  // max_output_bytes bounds the function's output; past it the output is
  // invalid.
  int64 max_output_bytes = 7;
  // output_key, when set, is where the host keeps the checked output in the
  // bucket, so a server can replay it for a retried call.
  string output_key = 8;
}

// InvokeResponse is returned whenever the host took the input, including
// when it rejected it or the function failed. output has been checked
// against the contract. error means the host could not take it (at
// capacity, boot failed) and carries nothing else.
message InvokeResponse {
  oneof result {
    bytes output = 1;
    functions.v1.FunctionError function_error = 2;
    Error error = 3;
  }
  string instance_id = 4;
  functions.v1.StartKind start_kind = 5;
  int64 acquire_us = 6;
  int64 run_us = 7;
}

// InvocationEvent is published as a host moves an invocation along, so the
// server can show STARTING and RUNNING before the reply arrives.
message InvocationEvent {
  string invocation_id = 1;
  functions.v1.InvocationStatus status = 2;
  string instance_id = 3;
  functions.v1.StartKind start_kind = 4;
  int64 acquire_us = 5;
}

message DescribeRequest {}

message DescribeResponse {
  functions.v1.Host host = 1;
}

message ListInstancesRequest {}

message ListInstancesResponse {
  repeated functions.v1.Instance instances = 1;
}

// Heartbeat is published by every host on its own subject.
message Heartbeat {
  functions.v1.Host host = 1;
  // artifacts are those the host has built and takes invocations for, with
  // what it holds of each. The server places invocations from this.
  repeated ArtifactState artifacts = 2;
}

// ArtifactState is what a host holds of one artifact.
message ArtifactState {
  string id = 1;
  // idle is how many warm instances are waiting for an invocation.
  int32 idle = 2;
  // busy is how many instances are booting or running one.
  int32 busy = 3;
}

// ServerHeartbeat is published by every server on its own subject, so any
// of them can answer for all of them.
message ServerHeartbeat {
  string name = 1;
  // pending is how many invocations the server has accepted that no host
  // has started: demand no host has room for yet.
  int32 pending = 2;
}

// ActiveInvocationsRequest asks every server for the invocations it holds.
message ActiveInvocationsRequest {}

message ActiveInvocationsResponse {
  // invocations are those in flight on the server, and those that ended
  // moments ago and may not have been written yet.
  repeated functions.v1.Invocation invocations = 1;
}

// InvocationRecords is a batch of ended invocations for the database. Hosts
// publish one per flush; a server publishes one for an invocation whose
// outcome it alone knows.
message InvocationRecords {
  repeated functions.v1.Invocation invocations = 1;
}
