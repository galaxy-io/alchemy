version: v2
clean: false
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/galaxy-io/alchemy/api
plugins:
  - local: protoc-gen-go
    out: api
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: api
    opt: paths=source_relative
  - remote: buf.build/community/sudorandom-connect-openapi:v0.27.2
    out: api
    opt:
      - features=connectrpc
      - content-types=json
      - format=json
      - path=openapi.json
      - trim-unused-types
    # host.v1 and supervisor.v1 are the server's internal contracts, not public API.
    exclude_types:
      - host.v1
      - supervisor.v1
