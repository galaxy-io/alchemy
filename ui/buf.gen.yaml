version: v2
clean: true
inputs:
  - directory: ../protos
    # host.v1 and supervisor.v1 are the server's internal contracts, not public API.
    exclude_paths:
      - ../protos/host
      - ../protos/supervisor
  # AuthService, served by the identity module.
  - git_repo: https://github.com/galaxy-io/modules.git
    ref: identity/v0.1.0
    subdir: identity/proto
plugins:
  - local: protoc-gen-es
    out: src/gen
    opt:
      - target=ts
      - import_extension=none
