# Default values for the Alchemy Helm chart.
#
# This file is intentionally production-safe: connection strings must be
# supplied by the installer or by an existing Secret.

# -- Provide a name in place of `alchemy`.
nameOverride: ""

# -- String to fully override the generated release name.
fullnameOverride: ""

# -- Override the namespace used in rendered manifests.
namespaceOverride: ""

# -- Labels added to all Alchemy resources.
commonLabels: {}

# -- Labels added to the server and host pods.
podLabels: {}

# -- Existing runtime Secret with `PERSISTENCE_DSN` and `NATS_URL`, plus
# `ENCRYPTION_KEY` and the `auth` credentials when they are used. The server
# reads all of it; hosts read only `NATS_URL`.
existingSecret: ""

secrets:
  # -- Secret storage provider: `datastore`, `aws-secrets-manager` or
  # `gcp-secret-manager`. `datastore` keeps secrets in PostgreSQL and emits no
  # `SECRET_PROVIDER`. The others use the SDK's default credentials, such as
  # the server's IRSA role or workload identity.
  type: datastore

  # -- Root name external secret stores give every secret (`SECRETS_PREFIX`).
  # Defaults to `alchemy`: AWS names secrets `alchemy/<tenant>/...` and GCP
  # `alchemy-<hash>`, and a prefix replaces that word. Unused by datastore.
  prefix: ""

  datastore:
    # -- Base64 AES key the server encrypts tenant secrets with before storing
    # them in PostgreSQL, kept in the chart-created Secret as `ENCRYPTION_KEY`.
    # Required for the secrets API unless `existingSecret` carries it; without
    # it the API is off.
    encryptionKey: ""
    # -- Id stored with each secret for the key that encrypted it
    # (`ENCRYPTION_KEY_ID`). Change it when rotating the key.
    encryptionKeyId: ""

  aws:
    # -- AWS region for Secrets Manager (`AWS_REGION`). Leave empty to use the
    # SDK default chain.
    region: ""

  gcp:
    # -- GCP project holding Secret Manager secrets (`GCP_PROJECT_ID`).
    # Required when `secrets.type` is `gcp-secret-manager`.
    projectId: ""
    # -- GCP region holding Secret Manager secrets (`GCP_REGION`).
    # Required when `secrets.type` is `gcp-secret-manager`.
    region: ""

auth:
  # -- Enable authentication. Disabled leaves the API unauthenticated and every
  # request in the default tenant.
  enabled: false

  # -- Identity provider: `keycloak`, `zitadel` or `proxy`. `proxy` trusts
  # identity headers from a gateway that signs people in.
  type: keycloak

  bootstrap:
    # -- Tenant converged on every boot (`AUTH_BOOTSTRAP_TENANT`).
    tenant: ""
    # -- Person who administers the tenant (`AUTH_BOOTSTRAP_ADMIN_EMAIL`),
    # created on boot with `adminPassword` and left alone once it exists.
    # Closes sign-up: people join by invitation.
    adminEmail: ""
    # -- That person's initial password, kept in the chart-created Secret as
    # `AUTH_BOOTSTRAP_ADMIN_PASSWORD`. With `existingSecret`, supply it there.
    adminPassword: ""

  # -- Origin the UI is served from (`AUTH_UI_ORIGIN`), normally the ingress
  # host. An https origin marks the session cookie Secure.
  uiOrigin: ""

  keycloak:
    # -- Realm URL, `https://<host>/realms/<realm>` (`AUTH_ISSUER`). Must match
    # what the realm advertises. Keycloak 26 or newer.
    # @default -- required when `auth.type=keycloak`
    issuer: ""
    # -- Alchemy's confidential client (`AUTH_CLIENT_ID`).
    clientId: alchemy
    # -- The client's secret, kept in the chart-created Secret as
    # `AUTH_CLIENT_SECRET`. With `existingSecret`, supply it there.
    clientSecret: ""
    # -- Master-realm admin (`AUTH_ADMIN_USERNAME`). With `adminPassword` the
    # server creates the realm and client on boot.
    adminUser: ""
    # -- Master-realm admin password, kept in the chart-created Secret as
    # `AUTH_ADMIN_PASSWORD`.
    adminPassword: ""
    bootstrap:
      # -- Admin service account on `auth.bootstrap.tenant`, so an SDK works
      # before anyone signs in (`AUTH_BOOTSTRAP_CLIENT_ID`). Set with
      # `clientSecret` or not at all.
      clientId: ""
      # -- Its secret, kept in the chart-created Secret as
      # `AUTH_BOOTSTRAP_CLIENT_SECRET`.
      clientSecret: ""

  zitadel:
    # -- Zitadel base URL (`AUTH_ISSUER`). Must equal the issuer Zitadel
    # advertises.
    # @default -- required when `auth.type=zitadel`
    issuer: ""
    # -- Machine-user personal access token with instance rights, kept in the
    # chart-created Secret as `AUTH_PAT`. With `existingSecret`, supply it
    # there.
    pat: ""

  proxy:
    # -- The one gateway tenant this deployment serves (`AUTH_PROXY_TENANT`).
    # Empty accepts any tenant the gateway names.
    tenant: ""

persistence:
  postgresql:
    # -- PostgreSQL connection string stored in the chart-created Secret as `PERSISTENCE_DSN`.
    # Required unless `existingSecret` is set. The server applies migrations on start.
    # @default -- required
    dsn: ""

eventBus:
  nats:
    # -- NATS connection URL stored in the chart-created Secret as `NATS_URL`.
    # Required unless `existingSecret` is set. The server must allow 64MB
    # payloads (`max_payload`), since messages carry whole function inputs and
    # outputs, and have JetStream enabled with memory storage for function logs.
    # @default -- required
    url: ""

functionLogs:
  # -- Bucket every invocation's full log is uploaded to, as a gzipped object
  # per invocation: `s3://BUCKET?region=REGION` or `gs://BUCKET`. Hosts need
  # write access and the server read access, through the service accounts'
  # cloud identity. Empty keeps logs on NATS only, for `retention`.
  bucket: ""
  # -- How long NATS keeps the latest lines of every invocation's log, for
  # live and recent reads.
  retention: 1h
  # -- Memory NATS may use for function logs across all invocations. The
  # oldest lines go first, and are already in the bucket.
  maxBytes: 1073741824

artifacts:
  # -- Bucket of the layers builds extract over an image, such as the files
  # of a function built from source: `s3://BUCKET?region=REGION` or
  # `gs://BUCKET`. The server needs write access and hosts read access,
  # through the service accounts' cloud identity. Layers must outlive every
  # version that uses them, so give it no expiry rule. Empty means functions
  # are built from images only.
  bucket: ""

runtimes:
  # -- Registry prefix of the runtime images functions built from source land
  # on: a runtime's image is `<imagePrefix>/python:3.13`.
  imagePrefix: ghcr.io/galaxy-io/alchemy/runtime
  # -- Where the runtimes' icons are served from, as
  # `<iconBaseUrl>/source-icon-<runtime>-<dark|light>.svg`.
  iconBaseUrl: https://cdn.getgalaxy.io/sources

server:
  image:
    # -- Server image repository.
    repository: ghcr.io/galaxy-io/alchemy/server
    # -- Server image tag.
    # @default -- `""` (defaults to chart appVersion)
    tag: ""
    # -- Server image pull policy.
    pullPolicy: IfNotPresent
    # -- Image pull secrets for the server Deployment.
    pullSecrets: []

  serviceAccount:
    # -- Existing ServiceAccount name for the server. When set, the chart does not create one.
    name: ""
    # -- Annotations for the chart-created server ServiceAccount, e.g. an IRSA role ARN.
    annotations: {}

  # -- Number of server replicas when `server.autoscaling.enabled` is false.
  # Any replica serves any request.
  replicas: 1

  invoke:
    # -- How long a call waits for its result, queued and running, when the
    # caller sets no deadline of its own.
    deadline: 5m
    # -- The longest deadline a caller may set, and how long the queue keeps
    # an invocation no host has taken.
    maxDeadline: 1h
    # -- How many NATS servers keep each queued invocation.
    queueReplicas: 1
    # -- How long an invocation waits after its first failed attempt. Each
    # later wait is five times longer.
    retryBackoff: 1s
    # -- The longest wait between two attempts.
    retryBackoffMax: 5m
    async:
      # -- How long an async invocation may wait in the queue and between
      # its attempts before it is recorded canceled. The queue keeps
      # invocations this long plus a margin.
      maxAge: 24h

  # -- How long an invoke's idempotency key keeps a retry with the same key
  # from running the function again.
  idempotencyWindow: 24h

  invocationStream:
    # -- How long NATS keeps an invocation record no server has written to
    # PostgreSQL yet.
    retention: 24h
    # -- How many NATS servers keep each unwritten record.
    replicas: 1

  autoscaling:
    # -- Scale servers with a HorizontalPodAutoscaler on CPU. Needs
    # `server.resources.requests.cpu`.
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    # -- Average CPU, as a percent of the request, to hold the servers at.
    targetCPUUtilizationPercentage: 70

  podDisruptionBudget:
    # -- Keep a PodDisruptionBudget for the server.
    enabled: true
    # -- Server pods that must stay up through voluntary disruptions such as
    # node drains. With one replica a drain waits for it, so the budget only
    # applies when there is more than one replica or autoscaling is on.
    minAvailable: 1

  # -- Server log level: `debug`, `info`, `warn` or `error`.
  logLevel: info
  # -- Server log format: `json` or `text`.
  logFormat: json

  ui:
    # -- Origins of other apps, such as a standalone Filament, that may open
    # an Alchemy flow and get the user back when it ends
    # (`UI_RETURN_ORIGINS`). The UI's own origin is always allowed.
    returnOrigins: []

  service:
    # -- Service type.
    type: ClusterIP
    # -- Server service and container port.
    port: 8780
    # -- Annotations for the Service, e.g. cloud load balancer settings.
    annotations: {}

  ingress:
    # -- Enable an Ingress for the server API.
    enabled: false
    # -- IngressClass name, e.g. `nginx` or `alb`. Empty uses the cluster default.
    className: ""
    # -- Annotations for the Ingress, e.g. a cert-manager issuer or ALB settings.
    annotations: {}
    # -- Path served by the Ingress.
    path: /
    # -- PathType for the path.
    pathType: Prefix
    # -- Hostnames served by the Ingress.
    hosts:
      - alchemy.example.com
    # -- Ingress TLS configuration, passed through verbatim.
    tls: []

  # -- Server resource requests and limits.
  # @default -- `{}` (See [values.yaml])
  resources: {}
  # -- Node selector for the server. It needs no KVM and can run anywhere.
  nodeSelector: {}
  # -- Tolerations for the server.
  tolerations: []
  # -- Affinity for the server.
  affinity: {}

host:
  image:
    # -- Host image repository. The image carries Firecracker, the guest kernel and the supervisor.
    repository: ghcr.io/galaxy-io/alchemy/host
    # -- Host image tag.
    # @default -- `""` (defaults to chart appVersion)
    tag: ""
    # -- Host image pull policy.
    pullPolicy: IfNotPresent
    # -- Image pull secrets for the host Deployment.
    pullSecrets: []

  serviceAccount:
    # -- Existing ServiceAccount name for hosts. When set, the chart does not create one.
    name: ""
    # -- Annotations for the chart-created host ServiceAccount.
    annotations: {}

  # -- Number of hosts. Each runs on its own node; on an autoscaled cluster,
  # raising this is what brings up more KVM nodes. Ignored when
  # `host.autoscaling.enabled` is true.
  replicas: 1

  autoscaling:
    # -- Scale hosts with KEDA on slot demand: busy slots plus invocations
    # waiting for one, read from the server's `/scaling`. Requires KEDA.
    enabled: false
    # -- Fewest hosts. Keep at least 1: a new KVM node takes minutes.
    minReplicas: 1
    # -- Most hosts.
    maxReplicas: 10
    # -- Percent of each host's `maxInstances` to keep busy. Lower
    # leaves more headroom for bursts.
    targetUtilization: 75
    # -- Seconds between KEDA's reads of `/scaling`.
    pollingInterval: 15
    # -- Seconds demand must stay low before hosts are removed.
    scaleDownStabilizationSeconds: 300

  # -- Nodes that run a host. They must expose `/dev/kvm`: bare
  # metal, or virtual machines with nested virtualization enabled.
  nodeSelector:
    alchemy.getgalaxy.io/kvm: "true"
  # -- Tolerations for hosts. The default tolerates the taint that keeps
  # everything else off KVM nodes: `alchemy.getgalaxy.io/kvm=true:NoSchedule`.
  tolerations:
    - key: alchemy.getgalaxy.io/kvm
      operator: Equal
      value: "true"
      effect: NoSchedule
  # -- Affinity for hosts, merged with the built-in anti-affinity that keeps one host per node.
  affinity: {}

  # -- Instances a host runs at once, busy and warm together (`MAX_INSTANCES`).
  maxInstances: 8
  # -- Guest memory in MiB the host may commit across its instances
  # (`MEMORY_BUDGET_MIB`). 0 means no limit. Guest memory is charged to the
  # host pod, so `resources.limits.memory` must leave room for it. When set
  # and `resources` names no memory request or limit, it is the pod's memory
  # request.
  memoryBudgetMiB: 0
  # -- How long a finished instance stays booted for the next invocation
  # (`WARM_INSTANCE_TTL`). `0s` starts every invocation afresh.
  warmInstanceTTL: 5m
  # -- Idle instances kept booted per function before any invocation arrives (`PREWARM_COUNT`).
  prewarmCount: 0
  snapshots:
    # -- Snapshot every version after its build and restore it per invocation
    # instead of booting a kernel (`SNAPSHOTS_ENABLED`).
    enabled: true
  console:
    # -- Keep the guest serial console on (`CONSOLE_ENABLED`). Observable, slower boot.
    enabled: false
  eviction:
    # -- Newest versions of each function a host keeps built whatever their use (`KEPT_VERSIONS`).
    keptVersions: 2
    # -- How long an older version goes without an invocation before the host
    # drops its snapshot and drives (`VERSION_IDLE_TTL`). `0s` keeps every version.
    versionIdleTTL: 24h
  # -- How long a host uses a fetched secret value before asking a server for
  # it again (`SECRETS_REFRESH_INTERVAL`). A rotated secret reaches functions
  # within this.
  secretsRefreshInterval: 5m

  # -- Host log level: `debug`, `info`, `warn` or `error`.
  logLevel: info
  # -- Host log format: `json` or `text`.
  logFormat: json

  data:
    # -- Size limit for the `emptyDir` holding the kernel, the rootfs cache
    # and microVM jails. Empty means no limit.
    sizeLimit: ""

  # -- Seconds a host gets to stop its microVMs on shutdown.
  terminationGracePeriodSeconds: 60
  # -- Hosts replaced at a time during a rolling update.
  maxUnavailable: 1

  # -- Host resource requests and limits. Size these for the microVMs, not the
  # host process: guest memory and vCPUs are charged to this pod.
  # @default -- `{}` (See [values.yaml])
  resources: {}

# Vendored PostgreSQL configuration.
postgresql:
  # -- Enable the vendored Bitnami PostgreSQL chart for local or test clusters. See the [Bitnami PostgreSQL chart](https://artifacthub.io/packages/helm/bitnami/postgresql) for additional configuration.
  enabled: false
  # -- Full name override for the vendored PostgreSQL release.
  fullnameOverride: alchemy-postgresql
  auth:
    # -- Disable the default `postgres` superuser in the vendored PostgreSQL chart.
    enablePostgresUser: false
    # -- Database created by the vendored PostgreSQL chart.
    database: alchemy
    # -- Username created by the vendored PostgreSQL chart.
    username: alchemy
    # -- Password for the vendored PostgreSQL user. Must match `persistence.postgresql.dsn` when vendored PostgreSQL is enabled.
    # @default -- required when `postgresql.enabled=true`
    password: ""
  primary:
    # -- Resources for the vendored PostgreSQL primary. Overrides the upstream
    # `nano` preset (192Mi memory limit), which risks OOM kills and unclean
    # shutdowns under real load.
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        memory: 1Gi
    persistence:
      # -- PVC size for the vendored PostgreSQL primary.
      size: 8Gi
    # Protect cold starts and crash recovery from liveness restarts for up to
    # five minutes. Readiness still removes an unhealthy primary promptly.
    startupProbe:
      enabled: true
      initialDelaySeconds: 0
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 30
      successThreshold: 1
    readinessProbe:
      failureThreshold: 2

# Vendored NATS configuration.
nats:
  # -- Enable the vendored NATS chart for local or test clusters. See the [NATS chart](https://artifacthub.io/packages/helm/nats/nats) for additional configuration.
  enabled: false
  # -- Full name override for the vendored NATS release.
  fullnameOverride: alchemy-nats
  config:
    jetstream:
      # -- Enable JetStream in the vendored NATS chart. Alchemy keeps recent
      # function logs and unwritten invocation records in JetStream streams.
      enabled: true
      memoryStore:
        # -- Keep function logs in memory; the bucket is their lasting copy.
        enabled: true
        # -- JetStream memory limit. Covers `functionLogs.maxBytes`.
        maxSize: 1Gi
      fileStore:
        # -- Keep queued invocations, and invocation records until a server
        # writes them to PostgreSQL, on disk, so a NATS restart loses none.
        enabled: true
        pvc:
          size: 10Gi
    merge:
      # -- Largest message NATS accepts. Payloads carry whole function inputs
      # and outputs, so this matches the server's payload limit.
      max_payload: << 64MB >>
  container:
    # -- Merged into the vendored NATS container spec. Sets resources so the
    # pod is not BestEffort QoS (first evicted under node pressure); the
    # upstream chart sets none.
    merge:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 2Gi
