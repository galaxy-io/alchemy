apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "alchemy.host.fullname" . }}
  namespace: {{ include "alchemy.namespace" . }}
  labels:
    {{- include "alchemy.host.labels" . | nindent 4 }}
spec:
  # One host per node. Pending hosts are what make a node autoscaler such as
  # Karpenter launch KVM nodes; a DaemonSet would never ask for one.
  {{- if not .Values.host.autoscaling.enabled }}
  replicas: {{ .Values.host.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "alchemy.host.selectorLabels" . | nindent 6 }}
  # No surge: a surged host would need a node of its own.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: {{ .Values.host.maxUnavailable }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/host-configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "alchemy.host.selectorLabels" . | nindent 8 }}
        {{- include "alchemy.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "alchemy.host.serviceAccountName" . }}
      automountServiceAccountToken: false
      # Long enough to stop every microVM, busy ones included.
      terminationGracePeriodSeconds: {{ .Values.host.terminationGracePeriodSeconds }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.host.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: host
          image: {{ .Values.host.image.repository }}:{{ .Values.host.image.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.host.image.pullPolicy }}
          env:
            # Hosts are named after their node: one host per KVM node.
            - name: HOST_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NATS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "alchemy.secretName" . }}
                  key: NATS_URL
          envFrom:
            - configMapRef:
                name: {{ include "alchemy.host.fullname" . }}
          # Root with every capability: the jailer chroots each microVM, makes
          # its device nodes, manages its cgroup and drops it to its own uid.
          securityContext:
            privileged: true
          resources:
            {{- include "alchemy.host.resources" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/alchemy
            - name: kvm
              mountPath: /dev/kvm
      volumes:
        # The kernel, built root filesystems keyed by image digest, and one
        # jail per microVM. One volume, since jails hard-link the kernel and
        # rootfs. Losing it only means rebuilding on the next invocation.
        - name: data
          {{- with .Values.host.data.sizeLimit }}
          emptyDir:
            sizeLimit: {{ . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: kvm
          hostPath:
            path: /dev/kvm
            type: CharDevice
      {{- with .Values.host.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.host.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        {{- $onePerNode := dict "requiredDuringSchedulingIgnoredDuringExecution" (list (dict "topologyKey" "kubernetes.io/hostname" "labelSelector" (dict "matchLabels" (include "alchemy.host.selectorLabels" . | fromYaml)))) }}
        {{- toYaml (merge (dict "podAntiAffinity" $onePerNode) (deepCopy .Values.host.affinity)) | nindent 8 }}
