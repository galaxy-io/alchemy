apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "alchemy.host.fullname" . }}
  namespace: {{ include "alchemy.namespace" . }}
  labels:
    {{- include "alchemy.host.labels" . | nindent 4 }}
data:
  # Capacity
  MAX_INSTANCES: {{ .Values.host.maxInstances | quote }}
  MEMORY_BUDGET_MIB: {{ int64 .Values.host.memoryBudgetMiB | quote }}
  WARM_INSTANCE_TTL: {{ .Values.host.warmInstanceTTL | quote }}
  PREWARM_COUNT: {{ .Values.host.prewarmCount | quote }}
  SNAPSHOTS_ENABLED: {{ .Values.host.snapshots.enabled | quote }}
  CONSOLE_ENABLED: {{ .Values.host.console.enabled | quote }}
  # Eviction
  KEPT_VERSIONS: {{ .Values.host.eviction.keptVersions | quote }}
  VERSION_IDLE_TTL: {{ .Values.host.eviction.versionIdleTTL | quote }}
  # Egress
  EGRESS_SUBNET: {{ .Values.host.egress.subnet | quote }}
  EGRESS_DENY: {{ join "," .Values.host.egress.deny | quote }}
  EGRESS_DNS: {{ join "," .Values.host.egress.dns | quote }}
  REGISTRY_ALLOW: {{ join "," .Values.host.registryAllow | quote }}
  # Secrets
  SECRETS_REFRESH_INTERVAL: {{ .Values.host.secretsRefreshInterval | quote }}
  # Observability
  LOG_LEVEL: {{ .Values.host.logLevel | quote }}
  LOG_FORMAT: {{ .Values.host.logFormat | quote }}
  {{- with .Values.observability.otel.endpoint }}
  OTEL_SERVICE_NAME: {{ include "alchemy.host.fullname" $ | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ . | quote }}
  {{- with $.Values.observability.otel.protocol }}
  OTEL_EXPORTER_OTLP_PROTOCOL: {{ . | quote }}
  {{- end }}
  {{- with $.Values.observability.otel.resourceAttributes }}
  OTEL_RESOURCE_ATTRIBUTES: {{ include "alchemy.otelResourceAttributes" . | quote }}
  {{- end }}
  {{- end }}
  # Function logs
  LOGS_BUCKET: {{ .Values.functionLogs.bucket | quote }}
  # Build layers
  ARTIFACTS_BUCKET: {{ .Values.artifacts.bucket | quote }}
