apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "alchemy.host.fullname" . }}
  namespace: {{ include "alchemy.namespace" . }}
  labels:
    {{- include "alchemy.host.labels" . | nindent 4 }}
data:
  # Capacity
  MAX_CONCURRENCY: {{ .Values.host.maxConcurrency | quote }}
  MEMORY_MIB: {{ int64 .Values.host.memoryMiB | quote }}
  WARM_TTL: {{ .Values.host.warmTTL | quote }}
  PREWARM: {{ .Values.host.prewarm | quote }}
  CONSOLE: {{ .Values.host.console | quote }}
  # Observability
  LOG_LEVEL: {{ .Values.host.logLevel | quote }}
  LOG_FORMAT: {{ .Values.host.logFormat | quote }}
  # Function logs
  LOGS_BUCKET: {{ .Values.functionLogs.bucket | quote }}
  # Build layers
  ARTIFACTS_BUCKET: {{ .Values.artifacts.bucket | quote }}
