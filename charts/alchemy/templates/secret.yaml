{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "alchemy.secretName" . }}
  namespace: {{ include "alchemy.namespace" . }}
  labels:
    {{- include "alchemy.labels" . | nindent 4 }}
type: Opaque
data:
  PERSISTENCE_DSN: {{ .Values.persistence.postgresql.dsn | b64enc | quote }}
  NATS_URL: {{ .Values.eventBus.nats.url | b64enc | quote }}
  {{- with .Values.secrets.datastore.encryptionKey }}
  ENCRYPTION_KEY: {{ . | b64enc | quote }}
  {{- end }}
  {{- if .Values.auth.enabled }}
  {{- if eq .Values.auth.type "keycloak" }}
  AUTH_CLIENT_SECRET: {{ required "auth.keycloak.clientSecret is required for keycloak unless existingSecret is set" .Values.auth.keycloak.clientSecret | b64enc | quote }}
  {{- with .Values.auth.keycloak.adminPassword }}
  AUTH_ADMIN_PASSWORD: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.auth.keycloak.bootstrap.clientSecret }}
  AUTH_BOOTSTRAP_CLIENT_SECRET: {{ . | b64enc | quote }}
  {{- end }}
  {{- else if eq .Values.auth.type "zitadel" }}
  AUTH_PAT: {{ required "auth.zitadel.pat is required for zitadel unless existingSecret is set" .Values.auth.zitadel.pat | b64enc | quote }}
  {{- end }}
  {{- with .Values.auth.bootstrap.adminPassword }}
  AUTH_BOOTSTRAP_ADMIN_PASSWORD: {{ . | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}
