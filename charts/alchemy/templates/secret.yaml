{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "alchemy.secretName" . }}
  namespace: {{ include "alchemy.namespace" . }}
  labels:
    {{- include "alchemy.labels" . | nindent 4 }}
type: Opaque
data:
  PERSISTENCE_DSN: {{ .Values.persistence.postgresql.dsn | b64enc | quote }}
  NATS_URL: {{ .Values.eventBus.nats.url | b64enc | quote }}
  {{- with .Values.secrets.datastore.encryptionKey }}
  ENCRYPTION_KEY: {{ . | b64enc | quote }}
  {{- end }}
{{- end }}
