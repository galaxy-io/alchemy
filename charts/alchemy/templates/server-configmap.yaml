apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "alchemy.server.fullname" . }}
  namespace: {{ include "alchemy.namespace" . }}
  labels:
    {{- include "alchemy.server.labels" . | nindent 4 }}
data:
  # API
  ADDR: ":{{ .Values.server.service.port }}"
  # Placement
  HOSTS_PER_FUNCTION: {{ .Values.server.hostsPerFunction | quote }}
  # Invocations
  IDEMPOTENCY_WINDOW: {{ .Values.server.idempotencyWindow | quote }}
  # Observability
  LOG_LEVEL: {{ .Values.server.logLevel | quote }}
  LOG_FORMAT: {{ .Values.server.logFormat | quote }}
  # Function logs
  LOGS_BUCKET: {{ .Values.functionLogs.bucket | quote }}
  LOGS_RETENTION: {{ .Values.functionLogs.retention | quote }}
  LOGS_MAX_BYTES: {{ int64 .Values.functionLogs.maxBytes | quote }}
  # Artifacts
  ARTIFACTS_BUCKET: {{ .Values.artifacts.bucket | quote }}
  # Runtimes
  RUNTIME_IMAGE_PREFIX: {{ .Values.runtimes.imagePrefix | quote }}
  RUNTIME_ICON_BASE_URL: {{ .Values.runtimes.iconBaseUrl | quote }}
