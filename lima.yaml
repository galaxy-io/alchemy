# KVM host for local development. Firecracker needs /dev/kvm, which Docker
# Desktop does not provide; this VM has it through nested virtualization
# (Apple M3 or later, macOS 15 or later). `just vm` creates and starts it,
# mounting the repository at the same path as on the Mac.

base: template:docker

vmType: vz
nestedVirtualization: true
cpus: 4
memory: 8GiB
disk: 40GiB

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -euo pipefail
      export DEBIAN_FRONTEND=noninteractive
      apt-get update -q
      apt-get install -y -q conntrack e2fsprogs curl iproute2 nftables

      FC_VERSION=v1.17.0
      ARCH=$(uname -m)
      if [ ! -x /usr/local/bin/firecracker ]; then
        curl -fsSL "https://github.com/firecracker-microvm/firecracker/releases/download/${FC_VERSION}/firecracker-${FC_VERSION}-${ARCH}.tgz" | tar -xz -C /tmp
        install -m 0755 "/tmp/release-${FC_VERSION}-${ARCH}/firecracker-${FC_VERSION}-${ARCH}" /usr/local/bin/firecracker
        install -m 0755 "/tmp/release-${FC_VERSION}-${ARCH}/jailer-${FC_VERSION}-${ARCH}" /usr/local/bin/jailer
        rm -rf "/tmp/release-${FC_VERSION}-${ARCH}"
      fi

      # Newest 6.1 guest kernel from Firecracker's CI bucket, as in their getting-started guide.
      mkdir -p /var/lib/firecracker
      cd /var/lib/firecracker
      if ! ls vmlinux-* >/dev/null 2>&1; then
        S3="https://s3.amazonaws.com/spec.ccfc.min"
        PREFIX=$(curl -fsSL "$S3?list-type=2&prefix=firecracker-ci/&delimiter=/" | grep -oP '(?<=<Prefix>)firecracker-ci/v[0-9]+\.[0-9]+/(?=</Prefix>)' | sort -V | tail -1)
        KERNEL=$(curl -fsSL "$S3?list-type=2&prefix=${PREFIX}${ARCH}/vmlinux-" | grep -oP "(?<=<Key>)${PREFIX}${ARCH}/vmlinux-6\.1\.[0-9]+(?=</Key>)" | sort -V | tail -1)
        curl -fsSL -o "$(basename "$KERNEL")" "$S3/$KERNEL"
      fi

      # static_node applies the mode whenever the node is (re)created, not only on a uevent.
      echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' > /etc/udev/rules.d/99-kvm.rules
      udevadm control --reload
      udevadm trigger --name-match=kvm

probes:
  - description: "firecracker and jailer installed and /dev/kvm usable"
    script: |
      #!/bin/bash
      set -eu
      [ -x /usr/local/bin/firecracker ] && [ -x /usr/local/bin/jailer ] && [ -r /dev/kvm ] && [ -w /dev/kvm ]
