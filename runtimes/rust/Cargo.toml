[package]
name = "handler"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "handler"
path = "main.rs"

[dependencies]
arrow = { version = "60", default-features = false, features = ["ipc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
