version: v2
clean: false
inputs:
  # AuthService, served by the identity module.
  - git_repo: https://github.com/galaxy-io/modules.git
    ref: identity/v0.1.0
    subdir: identity/proto
plugins:
  - remote: buf.build/community/sudorandom-connect-openapi:v0.27.2
    out: api
    opt:
      - features=connectrpc
      - content-types=json
      - format=json
      - path=auth.openapi.json
      - trim-unused-types
